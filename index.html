<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>마음의 어휘력 52주</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --header-bg: #101828;
      --header-surface: #1d2939;
      --accent-red: #dc2626;
      --accent-green: #16a34a;
      --accent-indigo: #4f46e5;
      --accent-amber: #d97706;
      --accent-blue: #2563eb;
      --book-teal: #4c867d;
      --book-teal-soft: #567d77;
      --book-teal-line: #b5cfc9;
      --bg-canvas: #ffffff;
      --bg-sidebar: #f8fafc;
      --border-light: #e2e8f0;
      --text-primary: #0f172a;
      --text-body: #1f2937;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --radius-lg: 14px;
      --radius-md: 10px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --sidebar-width: 280px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      overflow: hidden;
    }

    .app-shell { display: flex; flex-direction: column; height: 100dvh; width: 100%; }

    .hdr-btn {
      border: none; border-radius: 9px; padding: 9px 14px;
      font-size: 13.5px; font-weight: 600; font-family: inherit;
      color: #ffffff; cursor: pointer; transition: filter 0.14s ease;
    }
    .hdr-btn:hover { filter: brightness(1.08); }
    .hdr-btn.btn-green { background: var(--accent-green); }
    .hdr-btn.btn-indigo { background: var(--accent-indigo); }
    .hdr-btn.btn-teal { background: var(--book-teal); }

    /* 상단 헤더 (단일 행: 목록 · 설정 · 일~토요일) */
    .top-header {
      background: var(--header-bg); color: #ffffff;
      padding: 10px 14px; border-bottom: 1px solid #1e293b;
      flex-shrink: 0; z-index: 30;
    }

    .day-tabs-wrap {
      display: flex; align-items: stretch; gap: 6px;
      overflow-x: auto; padding-bottom: 2px; scrollbar-width: none;
    }
    .day-tabs-wrap::-webkit-scrollbar { display: none; }

    .day-tab {
      flex: 1 0 auto; min-width: 72px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      padding: 8px 10px; border-radius: 9px;
      border: 1px solid #293548; background: #182234;
      color: #cbd5e1; font-family: inherit; cursor: pointer;
      transition: all 0.16s ease;
    }
    .day-tab:hover { background: #233047; color: #ffffff; }
    .day-tab.active {
      background: var(--accent-red); border-color: var(--accent-red);
      color: #ffffff; box-shadow: 0 3px 10px rgba(220, 38, 38, 0.35);
    }
    .day-tab-name { font-size: 14px; font-weight: 700; line-height: 1.1; }
    .day-tab-sub { font-size: 10.5px; opacity: 0.85; font-weight: 500; }

    .tab-util-btn {
      flex: 0 0 auto; min-width: 52px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      padding: 7px 10px; border-radius: 9px;
      border: 1px solid #334155; background: #1d2939;
      color: #e2e8f0; font-family: inherit; cursor: pointer;
      transition: all 0.16s ease;
    }
    .tab-util-btn:hover { background: #29384e; color: #ffffff; border-color: #475569; }
    .tab-util-btn.is-active {
      background: #2b3b52; border-color: #64748b; color: #ffffff;
    }
    .tab-util-label { font-size: 10px; font-weight: 600; line-height: 1; opacity: 0.9; }

    /* 기본(태블릿·PC) 레이아웃: 좌측 고정 사이드바 + 우측 본문 */
    .workspace {
      display: flex; flex-direction: row; flex: 1; min-height: 0;
      position: relative; overflow: hidden;
    }

    .sidebar-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.45); z-index: 35;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-light);
      display: flex; flex-direction: column; flex-shrink: 0;
      z-index: 20;
      transition: margin-left 0.22s ease, transform 0.24s ease;
    }
    .sidebar.collapsed {
      margin-left: calc(var(--sidebar-width) * -1);
    }

    .sidebar-header {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--border-light);
      background: #ffffff;
    }
    .sidebar-day-title {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
    }
    .sidebar-day-label { font-size: 14px; font-weight: 700; color: var(--text-primary); }
    .sidebar-header-right { display: flex; align-items: center; gap: 6px; }
    .sidebar-count-pill {
      font-size: 11px; font-weight: 700; background: #f0fdf4;
      color: #15803d; padding: 2px 8px; border-radius: 999px;
      border: 1px solid #bbf7d0;
    }
    .sidebar-close-btn {
      display: none;
      border: none; background: #f1f5f9; color: var(--text-secondary);
      width: 28px; height: 28px; border-radius: 7px;
      font-size: 18px; line-height: 1; cursor: pointer;
      align-items: center; justify-content: center;
    }
    .sidebar-close-btn:hover { background: #e2e8f0; color: var(--text-primary); }

    .search-box { position: relative; width: 100%; }
    .search-input {
      width: 100%; padding: 8px 30px 8px 12px; border-radius: var(--radius-md);
      border: 1px solid var(--border-light); background: #f8fafc;
      color: var(--text-primary); font-size: 16px; font-family: inherit; outline: none;
    }
    .search-input:focus { border-color: var(--book-teal); background: #ffffff; }
    .search-clear {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      border: none; background: transparent; color: var(--text-muted);
      font-size: 16px; cursor: pointer; display: none; padding: 4px;
    }

    .word-list { flex: 1; overflow-y: auto; padding: 10px 10px 24px; -webkit-overflow-scrolling: touch; }

    .word-item {
      width: 100%; text-align: left; display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; margin-bottom: 4px; border-radius: var(--radius-md);
      border: 1px solid transparent; background: transparent;
      cursor: pointer; font-family: inherit; transition: all 0.14s ease;
    }
    .word-item:hover { background: #ffffff; border-color: #e2e8f0; }
    .word-item.is-read {
      background: #f0fdf4; border-color: #bbf7d0;
    }
    .word-item.is-read:hover {
      background: #dcfce7; border-color: #86efac;
    }
    .word-item.active {
      background: #fef2f2; border-color: #fecaca;
      box-shadow: 0 1px 4px rgba(220, 38, 38, 0.08);
    }
    .word-item.active.is-read {
      background: #dcfce7; border-color: #4ade80;
      box-shadow: 0 1px 5px rgba(22, 163, 74, 0.16);
    }
    .word-item.active.is-read .word-item-title { color: #166534; font-weight: 700; }

    .item-num {
      flex-shrink: 0; width: 30px; height: 26px; border-radius: 7px;
      border: 1px solid transparent; padding: 0;
      background: #e2e8f0; color: var(--text-secondary);
      font-size: 11.5px; font-weight: 700; font-family: inherit;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.14s ease;
    }
    .item-num:hover {
      filter: brightness(0.95);
      transform: scale(1.06);
    }
    .word-item.active .item-num { background: var(--accent-red); color: #ffffff; }
    .word-item.is-read .item-num,
    .word-item.active.is-read .item-num {
      background: var(--accent-green); color: #ffffff;
      border-color: #15803d;
      box-shadow: 0 1px 4px rgba(22, 163, 74, 0.28);
    }

    .word-item-text { flex: 1; min-width: 0; }
    .word-item-title {
      font-size: 14px; font-weight: 600; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .word-item.active .word-item-title { color: #991b1b; font-weight: 700; }
    .word-item-sub {
      font-size: 11.5px; color: var(--text-muted); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .status-dots { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .ready-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--book-teal);
    }
    .answer-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent-amber);
    }
    .fav-dot-icon {
      display: inline-flex; align-items: center; justify-content: center;
      color: #e11d48; line-height: 1;
    }

    /* 본문 영역 */
    .main-content {
      flex: 1; min-width: 0; overflow-y: auto;
      padding: 0 0 48px;
      -webkit-overflow-scrolling: touch;
      background: #ffffff;
    }
    .content-container {
      width: 100%; max-width: 100%; margin: 0;
      display: flex; flex-direction: column; gap: 0;
    }
    .page-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
      padding: 14px 28px 12px;
      border-bottom: 1px solid #f1f5f9;
      background: #ffffff;
    }
    .toolbar-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .toolbar-day-pill {
      background: #101828; color: #ffffff; font-size: 12px;
      font-weight: 700; padding: 4px 10px; border-radius: 999px;
    }
    .toolbar-theme { font-size: 13.5px; font-weight: 600; color: var(--text-secondary); }

    .nav-prev-next { display: flex; align-items: center; gap: 6px; }
    .nav-order-btn {
      padding: 5px 10px; border-radius: 8px;
      border: 1px solid var(--border-light); background: #f8fafc;
      color: var(--text-secondary); font-size: 12.5px; font-weight: 700;
      font-family: inherit; cursor: pointer; margin-right: 2px;
      transition: all 0.14s ease;
    }
    .nav-order-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }
    .nav-order-btn.is-read {
      background: var(--accent-green); border-color: #15803d;
      color: #ffffff; box-shadow: 0 1px 4px rgba(22, 163, 74, 0.28);
    }

    .nav-btn {
      padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-light);
      background: #ffffff; color: var(--text-primary); font-size: 13px;
      font-weight: 600; font-family: inherit; cursor: pointer; box-shadow: var(--shadow-sm);
    }
    .nav-btn:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }
    .nav-btn:disabled { opacity: 0.4; cursor: default; }
    .nav-btn.edit-btn { border-color: #c7d2fe; background: #eef2ff; color: #3730a3; }
    .nav-btn.today-btn { border-color: var(--book-teal-line); background: #f0f7f6; color: var(--book-teal); }
    .nav-btn.today-btn:hover:not(:disabled) { background: #e1efed; border-color: var(--book-teal); }
    .nav-btn.list-btn { border-color: #bbf7d0; background: #f0fdf4; color: #15803d; }
    .nav-btn.list-btn:hover:not(:disabled) { background: #dcfce7; border-color: #86efac; }
    .nav-btn.fav-list-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      padding: 6px 10px;
      border-color: #fecdd3; background: #fff1f2; color: #e11d48;
    }
    .nav-btn.fav-list-btn:hover:not(:disabled) { background: #ffe4e6; border-color: #fda4af; }
    .nav-btn.fav-list-btn .fav-btn-count {
      font-size: 11.5px; font-weight: 700; line-height: 1;
    }

    .book-page {
      --page-pad-x: 34px;
      background: #ffffff;
      border: none;
      border-radius: 0;
      padding: 0 var(--page-pad-x) 46px;
      box-shadow: none;
    }

    /* 어휘·원어 + 우측 즐겨찾기(하트) 상단 고정 + 좌측에서 우측까지 꽉 채우는 얇은 하단 줄 */
    .book-title-wrap {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      z-index: 12;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin: 0 calc(var(--page-pad-x) * -1) 24px;
      padding: 18px var(--page-pad-x) 14px;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--book-teal-line);
      transition: box-shadow 0.18s ease;
    }
    .book-title-wrap.is-stuck {
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }
    .book-title-main {
      display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px;
      flex: 1; min-width: 0;
    }
    .book-word-kr {
      display: inline-block; margin: 0; font-size: 30px; font-weight: 800;
      color: var(--book-teal); letter-spacing: -0.025em; line-height: 1.25;
    }
    .book-word-orig { font-size: 16px; font-weight: 500; color: #82a39e; }
    .title-fav-btn {
      flex-shrink: 0;
      width: 38px; height: 36px;
      border-radius: 9px;
      border: 1px solid #e2e8f0;
      padding: 0;
      background: #f8fafc;
      color: #94a3b8;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .title-fav-btn:hover {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #f43f5e;
      transform: scale(1.05);
    }
    .title-fav-btn.is-fav {
      background: #fff1f2;
      border-color: #fda4af;
      color: #e11d48;
      box-shadow: 0 2px 6px rgba(225, 29, 72, 0.18);
    }
    .title-fav-btn.is-fav svg {
      animation: heartPop 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes heartPop {
      0% { transform: scale(0.65); }
      70% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    .book-origin {
      margin: 0; font-size: 14.8px; line-height: 1.85;
      color: var(--book-teal-soft); word-break: keep-all;
    }

    .book-quote-block { margin: 34px 0 32px; padding: 4px 0; }
    .book-quote-text {
      margin: 0; font-size: 16px; font-weight: 500; line-height: 1.75;
      color: #3f6f68; word-break: keep-all;
    }
    .book-quote-author { margin: 7px 0 0; font-size: 13.5px; font-weight: 500; color: #6b918b; }

    .book-essay {
      color: var(--text-body); font-size: 16px; line-height: 1.98;
      letter-spacing: -0.01em;
      word-break: break-all;
      text-align: justify;
    }
    .book-essay p { margin: 0 0 18px; text-indent: 0.85em; }
    .book-essay p:last-child { margin-bottom: 0; }

    /* 오늘의 질문 + 각 질문별 자동 확장 답변 입력창 */
    .book-questions { margin-top: 40px; }
    .book-q-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .book-q-title { margin: 0; font-size: 15.5px; font-weight: 700; color: var(--book-teal); white-space: nowrap; }
    .book-q-line { flex: 1; height: 1px; background: var(--book-teal-line); }
    .answer-save-status {
      font-size: 11.5px; font-weight: 500; color: var(--text-muted); white-space: nowrap;
    }

    .book-q-list {
      list-style: none; margin: 0; padding: 0;
      display: flex; flex-direction: column; gap: 20px;
    }
    .book-q-block {
      display: flex; flex-direction: column; gap: 8px;
    }
    .book-q-item {
      position: relative; margin: 0; padding-left: 16px; font-size: 15px;
      line-height: 1.75; color: #334155; font-weight: 500; word-break: keep-all;
    }
    .book-q-item::before {
      content: "·"; position: absolute; left: 2px; top: 0;
      font-weight: 800; color: var(--book-teal);
    }

    .answer-input-wrap {
      padding-left: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .answer-input-wrap.no-indent {
      padding-left: 0;
    }
    .answer-textarea {
      display: block;
      flex: 1 1 auto;
      min-width: 0;
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #d7e2df;
      background: #f8fafc;
      color: #15803d;
      font-weight: 500;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.65;
      resize: none;
      overflow: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      word-break: break-word;
      outline: none;
      transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .answer-textarea.has-value {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }
    .answer-textarea::-webkit-scrollbar { display: none; }
    .answer-textarea::placeholder { color: #94a3b8; font-weight: 400; }
    .answer-textarea:focus {
      background: #ffffff;
      border-color: var(--accent-green);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.14);
    }

    /* 답변 작성 시 우측 좋아요 아이콘 */
    .answer-like-badge {
      display: none;
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent-blue);
      color: #ffffff;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.28);
      user-select: none;
    }
    .answer-like-badge.show {
      display: inline-flex;
      animation: likePop 0.26s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes likePop {
      0% { transform: scale(0.55); opacity: 0; }
      70% { transform: scale(1.14); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .answer-box-footer {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 8px; margin-top: 16px;
    }
    .answer-clear-btn {
      padding: 7px 12px; border-radius: 8px;
      border: 1px solid var(--border-light); background: #ffffff;
      color: var(--text-secondary); font-size: 12.5px; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }
    .answer-clear-btn:hover { background: #f1f5f9; }
    .answer-save-btn {
      padding: 7px 14px; border-radius: 8px;
      border: none; background: var(--book-teal);
      color: #ffffff; font-size: 12.5px; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }
    .answer-save-btn:hover { filter: brightness(1.06); }

    /* 데이터 없음 상태 */
    .pending-box {
      margin-top: 16px; padding: 28px 20px; border-radius: var(--radius-md);
      border: 1px dashed #cbd5e1; background: #f8fafc; text-align: center;
      color: var(--text-muted); font-size: 14.5px; line-height: 1.8; word-break: keep-all;
    }
    .pending-actions { margin-top: 16px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }

    /* 편집 폼 */
    .edit-form { display: flex; flex-direction: column; gap: 14px; margin-top: 6px; }
    .edit-field { display: flex; flex-direction: column; gap: 6px; }
    .edit-label { font-size: 12.5px; font-weight: 700; color: var(--book-teal); }
    .edit-input, .edit-textarea {
      width: 100%; padding: 10px 12px; border-radius: 9px;
      border: 1px solid #cbd5e1; background: #ffffff; color: var(--text-primary);
      font-size: 16px; font-family: inherit; line-height: 1.65; outline: none;
    }
    .edit-input:focus, .edit-textarea:focus { border-color: var(--book-teal); }
    .edit-textarea { min-height: 110px; resize: vertical; }
    .edit-textarea.essay-area { min-height: 220px; }
    .edit-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

    /* 설정 모달 */
    .modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.52);
      z-index: 50; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-backdrop.open { display: flex; }

    .modal-card {
      width: 100%; max-width: 360px; background: #ffffff;
      border-radius: 16px; padding: 20px;
      box-shadow: 0 20px 44px rgba(15, 23, 42, 0.25);
      border: 1px solid var(--border-light);
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .modal-title { margin: 0; font-size: 16px; font-weight: 800; color: var(--text-primary); }
    .modal-close {
      border: none; background: #f1f5f9; color: var(--text-secondary);
      width: 30px; height: 30px; border-radius: 8px;
      font-size: 18px; line-height: 1; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: #e2e8f0; color: var(--text-primary); }

    .modal-status-group {
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px;
    }
    .modal-status {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; border-radius: 10px;
      background: #f8fafc; border: 1px solid var(--border-light);
      font-size: 13px; color: var(--text-secondary);
    }
    .modal-status strong { color: var(--text-primary); font-weight: 700; }

    .modal-actions { display: flex; flex-direction: column; gap: 9px; }
    .modal-action-btn {
      width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      padding: 12px 14px; border-radius: 11px; border: none;
      color: #ffffff; font-family: inherit; cursor: pointer; text-align: left;
      transition: filter 0.14s ease;
    }
    .modal-action-btn:hover { filter: brightness(1.07); }
    .modal-action-btn.btn-backup { background: var(--accent-indigo); }
    .modal-action-btn.btn-import { background: var(--accent-green); }
    .modal-action-title { font-size: 14.5px; font-weight: 700; }
    .modal-action-desc { font-size: 11.5px; opacity: 0.9; font-weight: 400; }

    /* 어휘 · 질문 · 답변 목록 모달 */
    .qa-modal-card {
      width: 100%;
      max-width: 740px;
      max-height: 86dvh;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 22px 48px rgba(15, 23, 42, 0.28);
      border: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .qa-modal-top {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border-light);
      background: #ffffff;
      flex-shrink: 0;
    }
    .qa-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .qa-modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .qa-modal-count {
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
      white-space: nowrap;
    }
    .qa-modal-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .qa-filter-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .qa-filter-btn {
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--border-light);
      background: #f8fafc;
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .qa-filter-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }
    .qa-filter-btn.active {
      background: #15803d;
      border-color: #15803d;
      color: #ffffff;
    }
    .qa-search-wrap {
      position: relative;
      flex: 1 1 180px;
      min-width: 160px;
    }
    .qa-search-input {
      width: 100%;
      padding: 7px 28px 7px 12px;
      border-radius: 9px;
      border: 1px solid var(--border-light);
      background: #f8fafc;
      color: var(--text-primary);
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }
    .qa-search-input:focus { border-color: var(--accent-green); background: #ffffff; }
    .qa-search-clear {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      display: none;
      padding: 4px;
    }
    .qa-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 22px;
      background: #f8fafc;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .qa-card {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 13px;
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
    }
    .qa-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      margin-bottom: 11px;
      border-bottom: 1px solid #edf2f7;
    }
    .qa-card-title-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .qa-card-meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .qa-day-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: #101828;
      color: #ffffff;
    }
    .qa-day-badge.is-read {
      background: var(--accent-green);
    }
    .qa-updated-at {
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .qa-word-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
    }
    .qa-word-kr {
      font-size: 18px;
      font-weight: 800;
      color: var(--book-teal);
      letter-spacing: -0.02em;
    }
    .qa-word-orig {
      font-size: 13px;
      font-weight: 500;
      color: #82a39e;
    }
    .qa-jump-btn {
      flex-shrink: 0;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--book-teal-line);
      background: #f0f7f6;
      color: var(--book-teal);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .qa-jump-btn:hover { background: #e1efed; border-color: var(--book-teal); }

    .qa-origin-box {
      margin: 0 0 13px;
      padding: 10px 12px;
      border-radius: 9px;
      background: #f8fafc;
      border-left: 3px solid var(--book-teal-line);
      font-size: 13.5px;
      line-height: 1.72;
      color: var(--book-teal-soft);
      word-break: break-all;
    }
    .qa-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .qa-pair {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .qa-question {
      position: relative;
      margin: 0;
      padding-left: 13px;
      font-size: 13.8px;
      font-weight: 600;
      line-height: 1.62;
      color: #334155;
      word-break: keep-all;
    }
    .qa-question::before {
      content: "Q.";
      position: absolute;
      left: 0;
      top: 0;
      font-size: 12px;
      font-weight: 800;
      color: var(--book-teal);
    }
    .qa-answer {
      margin: 0 0 0 12px;
      padding: 9px 12px;
      border-radius: 9px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.68;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .qa-answer.is-empty {
      background: #f8fafc;
      border-color: #e2e8f0;
      color: #94a3b8;
      font-size: 12.8px;
      font-weight: 400;
      padding: 6px 10px;
    }
    .qa-empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.8;
      background: #ffffff;
      border-radius: 12px;
      border: 1px dashed #cbd5e1;
    }

    /* 즐겨찾기 모달 */
    .fav-modal-card {
      width: 100%;
      max-width: 560px;
      max-height: 84dvh;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 22px 48px rgba(15, 23, 42, 0.28);
      border: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .fav-modal-top {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border-light);
      background: #ffffff;
      flex-shrink: 0;
    }
    .fav-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 11px;
    }
    .fav-modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .fav-modal-title-icon {
      display: inline-flex;
      align-items: center;
      color: #e11d48;
    }
    .fav-modal-count {
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      background: #fff1f2;
      color: #e11d48;
      border: 1px solid #fecdd3;
      white-space: nowrap;
    }
    .fav-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px 20px;
      background: #f8fafc;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .fav-item-card {
      width: 100%;
      text-align: left;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 13px 15px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.14s ease, box-shadow 0.14s ease, background-color 0.14s ease;
    }
    .fav-item-card:hover {
      border-color: #fda4af;
      background: #fffcfd;
      box-shadow: 0 3px 10px rgba(225, 29, 72, 0.08);
    }
    .fav-item-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .fav-item-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .fav-item-word-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 7px;
    }
    .fav-item-word {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--book-teal);
      letter-spacing: -0.02em;
    }
    .fav-item-orig {
      font-size: 12.5px;
      font-weight: 500;
      color: #82a39e;
    }
    .fav-item-origin {
      margin: 2px 0 0;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
    }
    .fav-remove-btn {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid #fecdd3;
      background: #fff1f2;
      color: #e11d48;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .fav-remove-btn:hover {
      background: #ffe4e6;
      border-color: #fb7185;
      transform: scale(1.06);
    }

    /* 토스트 */
    .toast {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #0f172a; color: #ffffff; padding: 10px 18px; border-radius: 999px;
      font-size: 13.5px; font-weight: 600; opacity: 0; pointer-events: none;
      transition: all 0.22s ease; z-index: 60; box-shadow: 0 8px 20px rgba(15, 23, 42, 0.28);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 중소형 태블릿 세로 화면 보정 (741px ~ 920px) */
    @media (max-width: 920px) and (min-width: 741px) {
      :root { --sidebar-width: 240px; }
      .page-toolbar { padding: 12px 20px 10px; }
      .book-page { --page-pad-x: 24px; padding: 0 var(--page-pad-x) 40px; }
      .book-title-wrap { padding: 16px var(--page-pad-x) 13px; }
      .book-word-kr { font-size: 27px; }
      .book-word-orig { font-size: 15px; }
    }

    /* 모바일 전용 반응형 (<= 740px): 목록 아이콘 클릭 시 좌측 드로어로 사이드바 표시 */
    @media (max-width: 740px) {
      .top-header { padding: 10px 10px; }
      .day-tab { flex: 0 0 auto; min-width: 58px; padding: 7px 9px; }
      .tab-util-btn { min-width: 46px; padding: 6px 8px; }

      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0;
        width: min(84vw, 310px);
        margin-left: 0 !important;
        transform: translateX(-100%);
        box-shadow: 8px 0 28px rgba(15, 23, 42, 0.22);
        z-index: 40;
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-backdrop.open { display: block; }
      .sidebar-close-btn { display: inline-flex; }

      .main-content { padding: 0 0 42px; }
      .page-toolbar { gap: 10px; padding: 11px 16px 10px; }
      .nav-prev-next { gap: 4px; flex-wrap: wrap; }
      .nav-btn { padding: 6px 9px; font-size: 12px; }
      .nav-order-btn { padding: 5px 7px; font-size: 11.5px; margin-right: 0; }
      .qa-modal-card { max-height: 90dvh; }
      .qa-modal-top { padding: 14px 14px 12px; }
      .qa-modal-body { padding: 12px 12px 18px; }
      .qa-card { padding: 13px 14px; }
      .qa-word-kr { font-size: 16.5px; }
      .book-page { --page-pad-x: 18px; padding: 0 var(--page-pad-x) 36px; }
      .nav-btn.fav-list-btn { padding: 6px 8px; }
      .book-title-wrap { padding: 14px var(--page-pad-x) 12px; margin-bottom: 20px; gap: 10px; }
      .book-word-kr { font-size: 25px; }
      .book-word-orig { font-size: 14px; }
      .title-fav-btn { width: 34px; height: 32px; border-radius: 8px; }
      .title-fav-btn svg { width: 17px; height: 17px; }
      .fav-modal-card { max-height: 88dvh; }
      .fav-modal-top { padding: 14px 14px 12px; }
      .fav-modal-body { padding: 12px 12px 18px; }
      .answer-input-wrap { padding-left: 8px; gap: 8px; }
      .answer-like-badge { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 상단 헤더: 목록 · 설정 · 일~토요일 탭 -->
    <header class="top-header">
      <nav class="day-tabs-wrap" id="dayTabs" aria-label="요일 선택"></nav>
      <input type="file" id="jsonFileInput" accept=".json,application/json" multiple style="display:none;" />
    </header>

    <!-- 통합 워크스페이스: 태블릿·PC는 좌측 고정 사이드바 / 모바일은 좌측 드로어 사이드바 -->
    <div class="workspace">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-day-title">
            <span class="sidebar-day-label" id="sidebarDayLabel">일요일 어휘</span>
            <div class="sidebar-header-right">
              <span class="sidebar-count-pill" id="sidebarCountPill">0 / 52</span>
              <button type="button" class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="목록 닫기">&times;</button>
            </div>
          </div>
          <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="현재 요일 어휘 검색..." autocomplete="off" />
            <button type="button" class="search-clear" id="searchClear" aria-label="검색어 지우기">&times;</button>
          </div>
        </div>
        <div class="word-list" id="wordList"></div>
      </aside>

      <main class="main-content" id="mainContent">
        <div class="content-container">
          <div class="page-toolbar">
            <div class="toolbar-meta">
              <span class="toolbar-day-pill" id="toolbarDayPill">일요일</span>
              <span class="toolbar-theme" id="toolbarTheme">다시 살아갈 용기를 주는 단어들</span>
            </div>
            <div class="nav-prev-next">
              <button type="button" class="nav-order-btn" id="navOrder" title="클릭하여 읽음 표시 전환">01 / 52</button>
              <button type="button" class="nav-btn edit-btn" id="editToggleBtn">편집</button>
              <button type="button" class="nav-btn" id="prevWordBtn">이전</button>
              <button type="button" class="nav-btn today-btn" id="todayWordBtn" title="오늘 요일 및 오늘 어휘로 이동">오늘</button>
              <button type="button" class="nav-btn" id="nextWordBtn">다음</button>
              <button type="button" class="nav-btn list-btn" id="qaListBtn" title="어휘·설명·질문·답변 목록 보기">목록</button>
              <button type="button" class="nav-btn fav-list-btn" id="favListBtn" title="즐겨찾기한 어휘 보기" aria-label="즐겨찾기한 어휘 보기">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
              </button>
            </div>
          </div>

          <article class="book-page" id="bookPage"></article>
        </div>
      </main>
    </div>
  </div>

  <!-- 설정 모달 (백업 & 저장하기) -->
  <div class="modal-backdrop" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="settingsModalTitle">설정</h2>
        <button type="button" class="modal-close" id="settingsCloseBtn" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-status-group">
        <div class="modal-status">
          <span>저장된 어휘 데이터</span>
          <strong id="storagePill">0 / 364</strong>
        </div>
        <div class="modal-status">
          <span>읽은 어휘</span>
          <strong id="readCountPill">0 / 364</strong>
        </div>
        <div class="modal-status">
          <span>즐겨찾기 어휘</span>
          <strong id="favCountPill">0개</strong>
        </div>
        <div class="modal-status">
          <span>작성한 질문 답변</span>
          <strong id="answerCountPill">0개</strong>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="modal-action-btn btn-backup" id="exportBtn">
          <span class="modal-action-title">백업 (통합 JSON 저장하기)</span>
          <span class="modal-action-desc">어휘 본문, 읽음·즐겨찾기 기록, 질문 답변을 JSON 파일로 내보냅니다.</span>
        </button>
        <button type="button" class="modal-action-btn btn-import" id="importBtn">
          <span class="modal-action-title">저장하기 (JSON 파일 불러오기)</span>
          <span class="modal-action-desc">JSON 파일을 선택해 브라우저에 불러와 저장합니다.</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 어휘 · 원어 · 설명 · 오늘의 질문 · 답변 모달 -->
  <div class="modal-backdrop" id="qaListModal" role="dialog" aria-modal="true" aria-labelledby="qaListModalTitle">
    <div class="qa-modal-card">
      <div class="qa-modal-top">
        <div class="qa-modal-header">
          <div class="qa-modal-title-wrap">
            <h2 class="modal-title" id="qaListModalTitle">어휘 · 질문 · 답변 목록</h2>
            <span class="qa-modal-count" id="qaListCountBadge">0개</span>
          </div>
          <button type="button" class="modal-close" id="qaListCloseBtn" aria-label="닫기">&times;</button>
        </div>
        <div class="qa-modal-controls">
          <div class="qa-filter-tabs" id="qaFilterTabs">
            <button type="button" class="qa-filter-btn active" data-filter="answered" id="qaFilterAnswered">답변한 어휘 (0)</button>
            <button type="button" class="qa-filter-btn" data-filter="day" id="qaFilterDay">현재 요일 (52)</button>
            <button type="button" class="qa-filter-btn" data-filter="all" id="qaFilterAll">전체 (364)</button>
          </div>
          <div class="qa-search-wrap">
            <input type="text" class="qa-search-input" id="qaSearchInput" placeholder="어휘·질문·답변 검색..." autocomplete="off" />
            <button type="button" class="qa-search-clear" id="qaSearchClear" aria-label="검색어 지우기">&times;</button>
          </div>
        </div>
      </div>
      <div class="qa-modal-body" id="qaListBody"></div>
    </div>
  </div>

  <!-- 즐겨찾기 어휘 모달 -->
  <div class="modal-backdrop" id="favListModal" role="dialog" aria-modal="true" aria-labelledby="favListModalTitle">
    <div class="fav-modal-card">
      <div class="fav-modal-top">
        <div class="fav-modal-header">

    function isMobileViewport() { return window.innerWidth <= MOBILE_BREAKPOINT; }
    function pad2(n) { return String(n).padStart(2, '0'); }

    function formatDateFromTimestamp(ts) {
      if (!ts || typeof ts !== 'number' || !Number.isFinite(ts) || ts <= 0) return '';
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return '';
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function formatNow24() {
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(msg) {

    // ./data/sun.js ~ sat.js 에서 주입된 window.MIND_VOCAB_DATA 자동 로드
    function loadDefaultDataFromScripts() {
      const source = window.MIND_VOCAB_DATA;
      if (!source || typeof source !== 'object') return;
      Object.keys(source).forEach(k => {
        const val = source[k];
        if (/^(sun|mon|tue|wed|thu|fri|sat)-\d{2}$/.test(k) && val && typeof val === 'object') {

            origin: String(val.origin || '').trim(),

            essay: String(val.essay || '').trim(),
            questions: Array.isArray(val.questions) ? val.questions.map(q => String(q).trim()).filter(Boolean) : []
          };
          if (hasContent(entryObj)) {
            defaultEntries[k] = entryObj;
          }
        }
      });
    }

    function getAnswerItems(key, minCount = 1) {
      const ans = storedAnswers[key];
      let arr = [];
      if (ans && Array.isArray(ans.items)) {
        arr = ans.items.map(v => String(v || ''));
      } else if (ans && typeof ans.text === 'string' && ans.text.length > 0) {
        arr = [ans.text];
      } else if (typeof ans === 'string' && ans.length > 0) {
        arr = [ans];
      }
      while (arr.length < minCount) arr.push('');
      return arr;
    }

    function getAnswerUpdatedAt(key) {
      const ans = storedAnswers[key];
      return (ans && typeof ans === 'object' && ans.updatedAt) ? String(ans.updatedAt) : '';
    }

    function hasAnswer(key) {
      const ans = storedAnswers[key];
      if (!ans) return false;
      if (Array.isArray(ans.items)) {
        return ans.items.some(v => String(v || '').trim().length > 0);
      }
      if (typeof ans === 'string') return ans.trim().length > 0;
      return !!(ans.text && String(ans.text).trim().length > 0);
    }

    function isWordRead(key) {
      const rec = storedRead[key];
      return !!(rec && (rec === true || rec.read === true));
    }

    function getWordReadAt(key) {
      const rec = storedRead[key];
      if (!rec) return 0;
      if (typeof rec === 'object' && typeof rec.readAt === 'number') return rec.readAt;
      return 0;
    }

    function getWordReadDate(key) {
      const rec = storedRead[key];
      if (!rec || typeof rec !== 'object') return '';
      if (typeof rec.readDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(rec.readDate.trim())) {
        return rec.readDate.trim();
      }
      if (typeof rec.readAt === 'number' && rec.readAt > 0) {
        return formatDateFromTimestamp(rec.readAt);
      }
      return '';
    }

    function isWordFav(key) {
      const rec = storedFavorites[key];
      return !!(rec && (rec === true || rec.fav === true));
    }

    // 특정 요일에서 지정된 날짜(YYYY-MM-DD)에 읽음 표시한 어휘 인덱스 반환 (없으면 -1)
    function getReadIndexOnDate(dayKey, dateStr) {
      const list = VOCAB_LIST[dayKey] || [];
      if (!list.length || !dateStr) return -1;

      let matchedIdx = -1;
      let latestReadAt = -1;

      list.forEach((_, idx) => {
        const key = getWordKey(dayKey, idx);
        if (isWordRead(key) && getWordReadDate(key) === dateStr) {
          const ts = getWordReadAt(key);
          if (ts > latestReadAt || (ts === latestReadAt && idx > matchedIdx)) {
            latestReadAt = ts;
            matchedIdx = idx;
          }
        }
      });

      return matchedIdx;
    }

    // 해당 요일에서 마지막으로 읽은 단어의 다음 어휘 인덱스 계산
    function getNextWordIndexForDay(dayKey) {
      const list = VOCAB_LIST[dayKey] || [];
      if (!list.length) return 0;

      let lastReadIdx = -1;
      let latestReadAt = -1;

      list.forEach((_, idx) => {
        const key = getWordKey(dayKey, idx);
        if (isWordRead(key)) {
          const ts = getWordReadAt(key);
          if (ts > latestReadAt || (ts === latestReadAt && idx > lastReadIdx)) {
            latestReadAt = ts;
            lastReadIdx = idx;
          }
        }
      });

      // 아직 읽은 어휘가 없으면 첫 번째(01) 어휘
      if (lastReadIdx === -1) return 0;

      // 마지막으로 읽은 단어 이후의 첫 미읽음 어휘 우선
      for (let i = lastReadIdx + 1; i < list.length; i++) {
        if (!isWordRead(getWordKey(dayKey, i))) return i;
      }
      // 이후가 모두 읽음이면 앞에서부터 첫 미읽음 어휘 탐색
      for (let i = 0; i < lastReadIdx; i++) {
        if (!isWordRead(getWordKey(dayKey, i))) return i;
      }
      // 52개 모두 읽었으면 01번(처음)으로 순환
      return 0;
    }

    // 오늘 요일이고 오늘 날짜에 읽음 저장된 어휘가 있으면 그 어휘를 우선 반환, 없으면 다음 미읽음 어휘 반환
    function getTargetWordIndexForDay(dayKey) {
      if (dayKey === getTodayDayKey()) {
        const readTodayIdx = getReadIndexOnDate(dayKey, getLocalDateStr());
        if (readTodayIdx !== -1) return readTodayIdx;
      }
      return getNextWordIndexForDay(dayKey);
    }

    function syncCurrentReadIndicators() {

      const key = getWordKey(dayKey, idx);

        showToast(`${pad2(idx + 1)}번 '${wordTitle}' 읽음 표시를 해제했습니다.`);

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') storedEntries = parsed;
        }
      } catch (e) {
        console.error('localStorage 로드 실패:', e);
      }

      try {
        const rawAns = localStorage.getItem(ANSWERS_STORAGE_KEY);
        if (rawAns) {
          const parsedAns = JSON.parse(rawAns);
          if (parsedAns && typeof parsedAns === 'object') storedAnswers = parsedAns;

      } catch (e) {

    // JSON 파싱 및 병합 (에세이 + 읽음 기록 + 질문 답변 모두 지원)
    function mergeJsonPayload(payload) {
      let added = 0;
      let answersAdded = 0;
      let readAdded = 0;
      let favAdded = 0;

      if (payload && typeof payload === 'object' && payload._userAnswers && typeof payload._userAnswers === 'object') {
        Object.keys(payload._userAnswers).forEach(k => {
          const a = payload._userAnswers[k];
          if (a && typeof a === 'object' && Array.isArray(a.items) && a.items.some(v => String(v || '').trim())) {
            storedAnswers[k] = { items: a.items.map(v => String(v || '')), updatedAt: String(a.updatedAt || '') };
            answersAdded++;
          } else if (Array.isArray(a) && a.some(v => String(v || '').trim())) {
            storedAnswers[k] = { items: a.map(v => String(v || '')), updatedAt: '' };
            answersAdded++;
          } else if (a && typeof a === 'object' && String(a.text || '').trim()) {
            storedAnswers[k] = { items: [String(a.text)], updatedAt: String(a.updatedAt || '') };
            answersAdded++;
          } else if (typeof a === 'string' && a.trim()) {
            storedAnswers[k] = { items: [a], updatedAt: '' };
            answersAdded++;
          }
        });
      }

      if (payload && typeof payload === 'object' && payload._readRecords && typeof payload._readRecords === 'object') {
        Object.keys(payload._readRecords).forEach(k => {
          const r = payload._readRecords[k];
          if (r === true) {
            storedRead[k] = { read: true, readAt: 0, readDate: '' };
            readAdded++;
          } else if (r && typeof r === 'object' && r.read) {
            const ts = Number(r.readAt) || 0;
            const rd = (typeof r.readDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.readDate.trim()))
              ? r.readDate.trim()
              : formatDateFromTimestamp(ts);
            storedRead[k] = { read: true, readAt: ts, readDate: rd };
            readAdded++;
          }
          if (val.isFavorite === true) {
            storedFavorites[k] = { fav: true, favAt: Number(val.favAt) || 0 };
            favAdded++;
          }
        });
      }

      if (payload && typeof payload === 'object' && payload._favoriteRecords && typeof payload._favoriteRecords === 'object') {
        Object.keys(payload._favoriteRecords).forEach(k => {
          const fv = payload._favoriteRecords[k];
          if (fv === true) {
            storedFavorites[k] = { fav: true, favAt: 0 };
            favAdded++;
          } else if (fv && typeof fv === 'object' && fv.fav) {
            storedFavorites[k] = { fav: true, favAt: Number(fv.favAt) || 0 };
            favAdded++;
          }
        });
      }

      const source = (payload && typeof payload === 'object')
        ? (payload.entries || payload.data || payload)
        : null;

      if (!source || typeof source !== 'object') return { added, answersAdded, readAdded, favAdded };

      Object.keys(source).forEach(k => {
        const val = source[k];
        if (/^(sun|mon|tue|wed|thu|fri|sat)-\d{2}$/.test(k) && val && typeof val === 'object') {
          const entryObj = {
            origin: String(val.origin || '').trim(),
            quote: String(val.quote || '').trim(),
            author: String(val.author || '').trim(),
            essay: String(val.essay || '').trim(),
            questions: Array.isArray(val.questions) ? val.questions.map(q => String(q).trim()).filter(Boolean) : []
          };
          if (hasContent(entryObj)) {
            storedEntries[k] = entryObj;
            added++;
          }
          if (Array.isArray(val.userAnswers) && val.userAnswers.some(v => String(v || '').trim())) {
            storedAnswers[k] = {
              items: val.userAnswers.map(v => String(v || '')),
              updatedAt: String(val.userAnswerUpdatedAt || '')
            };
            answersAdded++;
          } else if (typeof val.userAnswer === 'string' && val.userAnswer.trim()) {
            storedAnswers[k] = {
              items: [val.userAnswer],
              updatedAt: String(val.userAnswerUpdatedAt || '')
            };
            answersAdded++;
          }
          if (val.isRead === true) {
            const ts = Number(val.readAt) || 0;
            const rd = (typeof val.readDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(val.readDate.trim()))
              ? val.readDate.trim()
              : formatDateFromTimestamp(ts);
            storedRead[k] = { read: true, readAt: ts, readDate: rd };
            readAdded++;
          }
        } else if (VOCAB_LIST[k] && Array.isArray(val)) {
          val.forEach((item, idx) => {
            const key = getWordKey(k, idx);
            if (Array.isArray(item)) {
              const entryObj = {
                origin: String(item[2] || '').trim(),
                quote: String(item[3] || '').trim(),
                author: String(item[4] || '').trim(),
                essay: String(item[5] || '').trim(),
                questions: Array.isArray(item[6]) ? item[6] : []
              };
              if (hasContent(entryObj)) {
                storedEntries[key] = entryObj;
                added++;
              }
            } else if (item && typeof item === 'object') {
              const entryObj = {
                origin: String(item.origin || '').trim(),
                quote: String(item.quote || '').trim(),
                author: String(item.author || '').trim(),
                essay: String(item.essay || '').trim(),
                questions: Array.isArray(item.questions) ? item.questions : []
              };
              if (hasContent(entryObj)) {
                storedEntries[key] = entryObj;
                added++;
              }
              if (Array.isArray(item.userAnswers) && item.userAnswers.some(v => String(v || '').trim())) {
                storedAnswers[key] = {
                  items: item.userAnswers.map(v => String(v || '')),
                  updatedAt: String(item.userAnswerUpdatedAt || '')
                };
                answersAdded++;
              } else if (typeof item.userAnswer === 'string' && item.userAnswer.trim()) {
                storedAnswers[key] = {
                  items: [item.userAnswer],
                  updatedAt: String(item.userAnswerUpdatedAt || '')
                };
                answersAdded++;
              }
              if (item.isRead === true) {
                const ts = Number(item.readAt) || 0;
                const rd = (typeof item.readDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(item.readDate.trim()))
                  ? item.readDate.trim()
                  : formatDateFromTimestamp(ts);
                storedRead[key] = { read: true, readAt: ts, readDate: rd };
                readAdded++;
              }
              if (item.isFavorite === true) {
                storedFavorites[key] = { fav: true, favAt: Number(item.favAt) || 0 };
                favAdded++;
              }
            }
          });
        }
      });

      return { added, answersAdded, readAdded, favAdded };
    }

    function countSavedTotal() {
      let total = 0;
      DAYS_META.forEach(d => {
        VOCAB_LIST[d.key].forEach((_, idx) => {
          if (hasContent(getEntry(getWordKey(d.key, idx)))) total++;
        });
      });
      return total;
    }

    function countAnswersTotal() {
      let total = 0;
      DAYS_META.forEach(d => {
        VOCAB_LIST[d.key].forEach((_, idx) => {
          if (hasAnswer(getWordKey(d.key, idx))) total++;
        });
      });
      return total;
    }

    function countSavedInDay(dayKey) {

      VOCAB_LIST[dayKey].forEach((_, idx) => {
        if (hasContent(getEntry(getWordKey(dayKey, idx)))) cnt++;
      });
      return cnt;
    }

    function countReadTotal() {
      let total = 0;
      DAYS_META.forEach(d => {
        VOCAB_LIST[d.key].forEach((_, idx) => {

        });

    }

      VOCAB_LIST[dayKey].forEach((_, idx) => {

    function autoResizeTextarea(el) {
      if (!el) return;
      const prevScrollTop = mainContentEl.scrollTop;
      el.style.height = '0px';
      const borderY = el.offsetHeight - el.clientHeight;
      const nextHeight = Math.max(46, el.scrollHeight + borderY);
      el.style.height = nextHeight + 'px';
      if (mainContentEl.scrollTop !== prevScrollTop) {
        mainContentEl.scrollTop = prevScrollTop;
      }
    }

    function resizeAllAnswerTextareas() {
      bookPageEl.querySelectorAll('.answer-textarea').forEach(autoResizeTextarea);
    }

    function renderDayTabs() {

    function renderSidebar() {
      const meta = getDayMeta(currentDayKey);
      const list = VOCAB_LIST[currentDayKey];
      const keyword = searchInputEl.value.trim().toLowerCase();

      sidebarDayLabelEl.textContent = `${meta.name} 어휘`;
      storagePillEl.textContent = `${countSavedTotal()} / 364`;
      readCountPillEl.textContent = `${countReadTotal()} / 364`;
      favCountPillEl.textContent = `${countFavTotal()}개`;
      answerCountPillEl.textContent = `${countAnswersTotal()}개`;
      wordListEl.innerHTML = '';

      let visibleCount = 0;
      list.forEach((item, idx) => {
        const [title, orig] = item;
        const key = getWordKey(currentDayKey, idx);
        const ready = hasContent(getEntry(key));
        const answered = hasAnswer(key);
        const read = isWordRead(key);
        const readDate = read ? getWordReadDate(key) : '';
        const fav = isWordFav(key);

        if (keyword) {
          const hay = `${pad2(idx + 1)} ${title} ${orig}`.toLowerCase();
          if (!hay.includes(keyword)) return;
        }
        visibleCount++;

        const row = document.createElement('div');
        row.className = 'word-item'
          + (idx === currentIndex ? ' active' : '')
          + (read ? ' is-read' : '');
        row.setAttribute('role', 'button');
        row.tabIndex = 0;
        row.innerHTML = `
          <button type="button" class="item-num" title="${read ? (readDate ? `읽음 (${readDate}) · 클릭하여 해제` : '읽음 · 클릭하여 해제') : '번호를 눌러 읽음 표시 전환'}" aria-pressed="${read ? 'true' : 'false'}">${pad2(idx + 1)}</button>
          <div class="word-item-text">
            <div class="word-item-title">${escapeHtml(title)}</div>
            <div class="word-item-sub">${escapeHtml(orig)}</div>
          </div>
          <div class="status-dots">
            ${fav ? `<span class="fav-dot-icon" title="즐겨찾기됨">${getHeartSvg(true, 12)}</span>` : ''}
            ${ready ? '<span class="ready-dot" title="본문 저장됨"></span>' : ''}
            ${answered ? '<span class="answer-dot" title="답변 작성됨"></span>' : ''}
          </div>
        `;

        // 번호 클릭 시: 초록색 읽음 토글 및 저장
        const numBtn = row.querySelector('.item-num');
        numBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleWordRead(currentDayKey, idx);
        });

        // 항목 클릭 시: 해당 어휘 보기
        const selectWord = () => {
          currentIndex = idx;
          isEditMode = false;
          renderSidebar();
          renderDetail();
          if (isMobileViewport()) closeMobileSidebar();
          mainContentEl.scrollTo({ top: 0, behavior: 'smooth' });
        };
        row.addEventListener('click', selectWord);
        row.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectWord();
          }
        });

        wordListEl.appendChild(row);
      });

      const readDay = countReadInDay(currentDayKey);
      sidebarCountPillEl.textContent = keyword ? `검색 ${visibleCount}개` : `읽음 ${readDay} / ${list.length}`;

      if (visibleCount === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = 'padding: 28px 12px; text-align: center; color: #94a3b8; font-size: 13.5px;';
        empty.textContent = '검색 결과가 없습니다.';
        wordListEl.appendChild(empty);
      }
    }

    function bindAnswerBoxEvents(key) {
      const textareas = Array.from(bookPageEl.querySelectorAll('.answer-textarea'));
      const statusEl = document.getElementById('answerSaveStatus');
      const saveBtn = document.getElementById('answerSaveBtn');
      const clearBtn = document.getElementById('answerClearBtn');
      if (!textareas.length) return;

      resizeAllAnswerTextareas();
      requestAnimationFrame(resizeAllAnswerTextareas);

      const persistAnswers = (showNotice) => {
        const items = textareas.map(ta => ta.value);
        const hasAny = items.some(v => v.trim().length > 0);
        if (hasAny) {
          const nowStr = formatNow24();
          storedAnswers[key] = { items, updatedAt: nowStr };
          if (statusEl) statusEl.textContent = `저장됨 · ${nowStr}`;
        } else {
          delete storedAnswers[key];
          if (statusEl) statusEl.textContent = '미작성';
        }
        saveAnswersToStorage();
        renderSidebar();
        if (showNotice) showToast('답변이 저장되었습니다.');
      };

      const syncLikeBadge = (ta) => {
        const hasVal = ta.value.trim().length > 0;
        ta.classList.toggle('has-value', hasVal);
        const badge = ta.parentElement ? ta.parentElement.querySelector('.answer-like-badge') : null;
        if (!badge) return;
        const wasShown = badge.classList.contains('show');
        if (hasVal !== wasShown) {
          badge.classList.toggle('show', hasVal);
        }
      };

      let saveTimer = null;
      textareas.forEach(ta => {
        syncLikeBadge(ta);
        ta.addEventListener('input', () => {
          syncLikeBadge(ta);
          autoResizeTextarea(ta);
          if (statusEl) statusEl.textContent = '입력 중...';
          clearTimeout(saveTimer);
          saveTimer = setTimeout(() => persistAnswers(false), 500);
        });

        ta.addEventListener('blur', () => {
          syncLikeBadge(ta);
          clearTimeout(saveTimer);
          persistAnswers(false);
        });
      });

      if (saveBtn) {
        saveBtn.addEventListener('click', () => {
          clearTimeout(saveTimer);
          persistAnswers(true);
        });
      }

      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          const hasAny = textareas.some(ta => ta.value.trim().length > 0);
          if (!hasAny) return;
          if (!confirm('작성한 답변을 모두 지울까요?')) return;
          textareas.forEach(ta => {
            ta.value = '';
            syncLikeBadge(ta);
            autoResizeTextarea(ta);
          });
          clearTimeout(saveTimer);
          persistAnswers(false);
          showToast('답변을 지웠습니다.');
        });
      }
    }

    function renderDetail() {
      const meta = getDayMeta(currentDayKey);

      const [title, orig] = list[currentIndex];
      const key = getWordKey(currentDayKey, currentIndex);
      const entry = getEntry(key);
      const isCurrentRead = isWordRead(key);
      toolbarDayPillEl.textContent = meta.name;
      toolbarThemeEl.textContent = meta.theme;
      navOrderEl.textContent = `${pad2(currentIndex + 1)} / ${list.length}`;
      syncCurrentReadIndicators();
      syncFavIndicators();
      prevWordBtn.disabled = currentIndex === 0;
      nextWordBtn.disabled = currentIndex === list.length - 1;

      if (isEditMode) {

        bookPageEl.innerHTML = `
          ${titleWrapHtml}
          <div class="edit-form">

              <label class="edit-label">어원 및 개념 설명</label>
              <textarea class="edit-textarea" id="edOrigin" placeholder="어휘의 어원과 핵심 개념을 입력하세요.">${escapeHtml(entry?.origin || '')}</textarea>

              <label class="edit-label">관련 명언</label>

              <label class="edit-label">명언 출처 / 인물</label>
              <input type="text" class="edit-input" id="edAuthor" placeholder="인물 이름" value="${escapeHtml(entry?.author || '')}" />
            </div>
            <div class="edit-field">
              <label class="edit-label">상세 설명 (에세이 · 문단 구분은 빈 줄)</label>
              <textarea class="edit-textarea essay-area" id="edEssay" placeholder="상세 설명과 에세이를 입력하세요.">${escapeHtml(entry?.essay || '')}</textarea>
            </div>
            <div class="edit-field">
              <label class="edit-label">오늘의 질문 (한 줄에 하나씩 입력)</label>
              <textarea class="edit-textarea" id="edQuestions" placeholder="질문 1&#10;질문 2&#10;질문 3">${escapeHtml(qText)}</textarea>
            </div>
            <div class="edit-footer">
              <button type="button" class="nav-btn" id="edCancelBtn">취소</button>
              <button type="button" class="hdr-btn btn-green" id="edSaveBtn">로컬스토리지에 저장</button>
            </div>
          </div>
        `;
        document.getElementById('edCancelBtn').addEventListener('click', () => {
          isEditMode = false;
          renderDetail();
        });
        document.getElementById('edSaveBtn').addEventListener('click', () => {
          const updated = {
            origin: document.getElementById('edOrigin').value.trim(),
            quote: document.getElementById('edQuote').value.trim(),
            author: document.getElementById('edAuthor').value.trim(),
            essay: document.getElementById('edEssay').value.trim(),
            questions: document.getElementById('edQuestions').value
              .split('\n').map(s => s.trim()).filter(Boolean)
          };
          if (hasContent(updated)) {
            storedEntries[key] = updated;
          } else {
            delete storedEntries[key];
          }
          saveToStorage();
          isEditMode = false;
          renderSidebar();
          renderDetail();
          showToast('내용이 로컬스토리지에 저장되었습니다.');
        });
        return;
      }

      const buildQuestionsSectionHtml = (questionsArr) => {
        const listQs = Array.isArray(questionsArr) ? questionsArr.filter(Boolean) : [];
        const answerCount = Math.max(1, listQs.length);
        const ansItems = getAnswerItems(key, answerCount);
        const updatedAt = getAnswerUpdatedAt(key);
        const statusText = hasAnswer(key)
          ? (updatedAt ? `저장됨 · ${escapeHtml(updatedAt)}` : '저장됨')
          : '미작성';

        const likeIconSvg = `
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M2 20h2c.55 0 1-.45 1-1v-9c0-.55-.45-1-1-1H2v11zm19.83-7.12c.11-.25.17-.52.17-.8V11c0-1.1-.9-2-2-2h-5.5l.92-4.65c.05-.22.02-.46-.08-.66-.23-.45-.52-.86-.88-1.22L14 2 7.59 8.41C7.21 8.79 7 9.3 7 9.83v7.84C7 18.95 8.05 20 9.34 20h8.11c.7 0 1.36-.37 1.72-.97l2.66-6.15z"/>
          </svg>
        `;

        const blocksHtml = listQs.length
          ? listQs.map((q, idx) => {
              const val = ansItems[idx] || '';
              const hasVal = val.trim().length > 0;
              return `
                <li class="book-q-block">
                  <p class="book-q-item">${escapeHtml(q)}</p>
                  <div class="answer-input-wrap">
                    <textarea class="answer-textarea" data-q-index="${idx}" rows="1" wrap="soft" placeholder="나의 답변을 적어보세요...">${escapeHtml(val)}</textarea>
                    <span class="answer-like-badge${hasVal ? ' show' : ''}" role="img" aria-label="좋아요" title="답변을 작성했어요!">${likeIconSvg}</span>
                  </div>
                </li>
              `;
            }).join('')
          : (() => {
              const val = ansItems[0] || '';
              const hasVal = val.trim().length > 0;
              return `
                <li class="book-q-block">
                  <div class="answer-input-wrap no-indent">
                    <textarea class="answer-textarea" data-q-index="0" rows="1" wrap="soft" placeholder="오늘의 질문에 대한 나의 생각과 답변을 자유롭게 적어보세요...">${escapeHtml(val)}</textarea>
                    <span class="answer-like-badge${hasVal ? ' show' : ''}" role="img" aria-label="좋아요" title="답변을 작성했어요!">${likeIconSvg}</span>
                  </div>
                </li>
              `;
            })();

        return `
          <section class="book-questions">
            <div class="book-q-header">
