            </div>
          </section>
        `;
      };

      if (!hasContent(entry)) {
        bookPageEl.innerHTML = `
          ${titleWrapHtml}
          <div class="pending-box">
            <strong>${escapeHtml(title)}</strong> (<code>${key}</code>)의 에세이 데이터가 아직 로컬스토리지에 없습니다.<br />
            <code>data/</code> 폴더의 요일별 JS 파일이 같은 폴더에 있으면 자동으로 불러와지며, 상단의 <strong>[설정]</strong> 버튼에서 JSON 파일을 직접 불러올 수도 있습니다.
            <div class="pending-actions">
              <button type="button" class="hdr-btn btn-green" id="inlineImportBtn">JSON 파일 불러오기</button>
              <button type="button" class="nav-btn edit-btn" id="inlineEditBtn">직접 작성하기</button>
            </div>
          </div>
          ${buildQuestionsSectionHtml([])}
        `;
        document.getElementById('inlineImportBtn').addEventListener('click', () => {
          jsonFileInput.value = '';
          jsonFileInput.click();
        });
        document.getElementById('inlineEditBtn').addEventListener('click', () => {
          isEditMode = true;
          renderDetail();
        });
        bindAnswerBoxEvents(key);
        return;
      }

      const paragraphsHtml = String(entry.essay || '')
        .split(/\n\s*\n/)
        .filter(Boolean)
        .map(p => `<p>${escapeHtml(p.trim())}</p>`)
        .join('');

      const quoteHtml = entry.quote ? `
        <blockquote class="book-quote-block">
          <p class="book-quote-text">${escapeHtml(entry.quote)}</p>
          ${entry.author ? `<p class="book-quote-author">_${escapeHtml(entry.author)}</p>` : ''}
        </blockquote>
      ` : '';

      const questionsSectionHtml = buildQuestionsSectionHtml(entry.questions);

      bookPageEl.innerHTML = `
        ${titleWrapHtml}
        ${entry.origin ? `<p class="book-origin">${escapeHtml(entry.origin)}</p>` : ''}
        ${quoteHtml}
        <div class="book-essay">${paragraphsHtml}</div>
        ${questionsSectionHtml}
      `;

      bindAnswerBoxEvents(key);
      updateStickyTitleShadow();
    }

    function renderAll() {
      renderDayTabs();
      renderSidebar();
      renderDetail();
    }

    function scrollActiveWordIntoView() {
      const activeEl = wordListEl.querySelector('.word-item.active');
      if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function scrollActiveDayTabIntoView() {
      const activeTab = dayTabsEl.querySelector('.day-tab.active');
      if (activeTab) activeTab.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    }

    function openSettingsModal() {
      storagePillEl.textContent = `${countSavedTotal()} / 364`;
      readCountPillEl.textContent = `${countReadTotal()} / 364`;
      favCountPillEl.textContent = `${countFavTotal()}개`;
      answerCountPillEl.textContent = `${countAnswersTotal()}개`;
      settingsModalEl.classList.add('open');
    }

    // 오늘 요일로 이동하고 마지막으로 읽은 어휘 다음 단어를 표시
    function syncToTodayAndNextWord(showNotice) {
      const todayDateStr = getLocalDateStr();
      const todayKey = getTodayDayKey();
      lastCheckedDateStr = todayDateStr;
      currentDayKey = todayKey;
      currentIndex = getTargetWordIndexForDay(todayKey);
      isEditMode = false;
      searchInputEl.value = '';
      searchClearEl.style.display = 'none';
      renderAll();
      scrollActiveDayTabIntoView();
      scrollActiveWordIntoView();
      mainContentEl.scrollTop = 0;

      if (showNotice) {
        const meta = getDayMeta(todayKey);
        const word = VOCAB_LIST[todayKey][currentIndex][0];
        showToast(`${meta.name}이 되어 다음 어휘(${pad2(currentIndex + 1)}번 ${word})로 이동했습니다.`);
      }
    }

    function checkDayRollover() {
      const todayDateStr = getLocalDateStr();
      if (lastCheckedDateStr && todayDateStr !== lastCheckedDateStr) {
        syncToTodayAndNextWord(true);
      }
    }

    function closeSettingsModal() {
      settingsModalEl.classList.remove('open');
    }

    function renderQaListModal() {
      const answeredTotal = countAnswersTotal();
      const curDayMeta = getDayMeta(currentDayKey);
      qaFilterAnsweredBtn.textContent = `답변한 어휘 (${answeredTotal})`;
      qaFilterDayBtn.textContent = `${curDayMeta.name} (${VOCAB_LIST[currentDayKey].length})`;
      qaFilterAllBtn.textContent = `전체 (364)`;

      qaFilterTabsEl.querySelectorAll('.qa-filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === qaModalFilter);
      });

      const kw = qaSearchInputEl.value.trim().toLowerCase();
      const rows = [];

      const daysToScan = qaModalFilter === 'day'
        ? [curDayMeta]
        : DAYS_META;

      daysToScan.forEach((dayMeta, dayOrder) => {
        const list = VOCAB_LIST[dayMeta.key] || [];
        list.forEach(([word, orig], idx) => {
          const key = getWordKey(dayMeta.key, idx);
          const answered = hasAnswer(key);
          if (qaModalFilter === 'answered' && !answered) return;

          const entry = getEntry(key);
          const origin = entry?.origin || '';
          const questions = Array.isArray(entry?.questions) ? entry.questions.filter(Boolean) : [];
          const ansItems = getAnswerItems(key, Math.max(1, questions.length));
          const updatedAt = getAnswerUpdatedAt(key);
          const read = isWordRead(key);

          if (kw) {
            const hay = [
              dayMeta.name,
              pad2(idx + 1),
              word,
              orig,
              origin,
              questions.join(' '),
              ansItems.join(' ')
            ].join(' ').toLowerCase();
            if (!hay.includes(kw)) return;
          }

          rows.push({
            dayKey: dayMeta.key,
            dayName: dayMeta.name,
            dayOrder,
            idx,
            key,
            word,
            orig,
            origin,
            questions,
            ansItems,
            answered,
            updatedAt,
            read
          });
        });
      });

      // 답변한 어휘 탭은 최근 작성/수정 날짜 내림차순 정렬
      if (qaModalFilter === 'answered') {
        rows.sort((a, b) => {
          if (a.updatedAt && b.updatedAt && a.updatedAt !== b.updatedAt) {
            return b.updatedAt.localeCompare(a.updatedAt);
          }
          if (a.updatedAt && !b.updatedAt) return -1;
          if (!a.updatedAt && b.updatedAt) return 1;
          if (a.dayOrder !== b.dayOrder) return a.dayOrder - b.dayOrder;
          return a.idx - b.idx;
        });
      }

      qaListCountBadgeEl.textContent = `${rows.length}개`;

      if (!rows.length) {
        if (qaModalFilter === 'answered' && !kw) {
          qaListBodyEl.innerHTML = `
            <div class="qa-empty-state">
              아직 작성된 질문 답변이 없습니다.<br />
              상단의 <strong>${escapeHtml(curDayMeta.name)}</strong> 또는 <strong>전체</strong> 탭을 누르면 모든 어휘의 설명과 질문을 한눈에 볼 수 있습니다.
            </div>
          `;
        } else {
          qaListBodyEl.innerHTML = `<div class="qa-empty-state">조건에 맞는 어휘가 없습니다.</div>`;
        }
        return;
      }

      const cardsHtml = rows.map(r => {
        const qaPairsHtml = r.questions.length
          ? r.questions.map((q, qIdx) => {
              const ansText = (r.ansItems[qIdx] || '').trim();
              return `
                <div class="qa-pair">
                  <p class="qa-question">${escapeHtml(q)}</p>
                  <p class="qa-answer${ansText ? '' : ' is-empty'}">${ansText ? escapeHtml(ansText) : '답변 미작성'}</p>
                </div>
              `;
            }).join('')
          : (() => {
              const ansText = (r.ansItems[0] || '').trim();
              return `
                <div class="qa-pair">
                  <p class="qa-answer${ansText ? '' : ' is-empty'}">${ansText ? escapeHtml(ansText) : '답변 미작성'}</p>
                </div>
              `;
            })();

        return `
          <div class="qa-card">
            <div class="qa-card-head">
              <div class="qa-card-title-group">
                <div class="qa-card-meta-row">
                  <span class="qa-day-badge${r.read ? ' is-read' : ''}">${escapeHtml(r.dayName)} · ${pad2(r.idx + 1)}</span>
                  ${r.updatedAt ? `<span class="qa-updated-at">답변 ${escapeHtml(r.updatedAt)}</span>` : ''}
                </div>
                <div class="qa-word-row">
                  <span class="qa-word-kr">${escapeHtml(r.word)}</span>
                  <span class="qa-word-orig">${escapeHtml(r.orig)}</span>
                </div>
              </div>
              <button type="button" class="qa-jump-btn" data-day="${r.dayKey}" data-idx="${r.idx}">이동</button>
            </div>
            ${r.origin ? `<p class="qa-origin-box">${escapeHtml(r.origin)}</p>` : ''}
            <div class="qa-items">${qaPairsHtml}</div>
          </div>
        `;
      }).join('');

      qaListBodyEl.innerHTML = cardsHtml;
    }

    function openQaListModal() {
      qaModalFilter = countAnswersTotal() > 0 ? 'answered' : 'day';
      qaSearchInputEl.value = '';
      qaSearchClearEl.style.display = 'none';
      renderQaListModal();
      qaListModalEl.classList.add('open');
      qaListBodyEl.scrollTop = 0;
    }

    function closeQaListModal() {
      qaListModalEl.classList.remove('open');
    }

    function renderFavListModal() {
      const kw = favSearchInputEl.value.trim().toLowerCase();
      const rows = [];

      DAYS_META.forEach((dayMeta, dayOrder) => {
        const list = VOCAB_LIST[dayMeta.key] || [];
        list.forEach(([word, orig], idx) => {
          const key = getWordKey(dayMeta.key, idx);
          if (!isWordFav(key)) return;

          const entry = getEntry(key);
          const origin = entry?.origin || '';
          const read = isWordRead(key);
          const favAt = getWordFavAt(key);

          if (kw) {
            const hay = `${dayMeta.name} ${pad2(idx + 1)} ${word} ${orig} ${origin}`.toLowerCase();
            if (!hay.includes(kw)) return;
          }

          rows.push({
            dayKey: dayMeta.key,
            dayName: dayMeta.name,
            dayOrder,
            idx,
            key,
            word,
            orig,
            origin,
            read,
            favAt
          });
        });
      });

      // 최근 즐겨찾기한 순서대로 정렬
      rows.sort((a, b) => {
        if (b.favAt !== a.favAt) return b.favAt - a.favAt;
        if (a.dayOrder !== b.dayOrder) return a.dayOrder - b.dayOrder;
        return a.idx - b.idx;
      });

      favListCountBadgeEl.textContent = `${rows.length}개`;

      if (!rows.length) {
        favListBodyEl.innerHTML = kw
          ? `<div class="qa-empty-state">검색 결과가 없습니다.</div>`
          : `<div class="qa-empty-state">아직 즐겨찾기한 어휘가 없습니다.<br />어휘 우측의 <strong>하트(♡)</strong> 아이콘을 눌러 마음에 남는 어휘를 모아 보세요.</div>`;
        return;
      }

      favListBodyEl.innerHTML = rows.map(r => `
        <div class="fav-item-card" role="button" tabindex="0" data-day="${r.dayKey}" data-idx="${r.idx}">
          <div class="fav-item-main">
            <div class="fav-item-meta">
              <span class="qa-day-badge${r.read ? ' is-read' : ''}">${escapeHtml(r.dayName)} · ${pad2(r.idx + 1)}</span>
            </div>
            <div class="fav-item-word-row">
              <span class="fav-item-word">${escapeHtml(r.word)}</span>
              <span class="fav-item-orig">${escapeHtml(r.orig)}</span>
            </div>
            ${r.origin ? `<p class="fav-item-origin">${escapeHtml(r.origin)}</p>` : ''}
          </div>
          <button type="button" class="fav-remove-btn" data-remove-day="${r.dayKey}" data-remove-idx="${r.idx}" title="즐겨찾기 해제" aria-label="즐겨찾기 해제">${getHeartSvg(true, 15)}</button>
        </div>
      `).join('');
    }

    function openFavListModal() {
      favSearchInputEl.value = '';
      favSearchClearEl.style.display = 'none';
      renderFavListModal();
      favListModalEl.classList.add('open');
      favListBodyEl.scrollTop = 0;
    }

    function closeFavListModal() {
      favListModalEl.classList.remove('open');
    }

    // 이벤트 연결
    sidebarBackdropEl.addEventListener('click', closeMobileSidebar);
    sidebarCloseBtn.addEventListener('click', closeMobileSidebar);
    settingsCloseBtn.addEventListener('click', closeSettingsModal);
    settingsModalEl.addEventListener('click', (e) => {
      if (e.target === settingsModalEl) closeSettingsModal();
    });

    qaListBtn.addEventListener('click', openQaListModal);
    qaListCloseBtn.addEventListener('click', closeQaListModal);
    qaListModalEl.addEventListener('click', (e) => {
      if (e.target === qaListModalEl) closeQaListModal();
    });
    qaFilterTabsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.qa-filter-btn');
      if (!btn) return;
      qaModalFilter = btn.dataset.filter || 'answered';
      renderQaListModal();
      qaListBodyEl.scrollTop = 0;
    });
    qaSearchInputEl.addEventListener('input', () => {
      qaSearchClearEl.style.display = qaSearchInputEl.value ? 'block' : 'none';
      renderQaListModal();
    });
    qaSearchClearEl.addEventListener('click', () => {
      qaSearchInputEl.value = '';
      qaSearchClearEl.style.display = 'none';
      renderQaListModal();
      qaSearchInputEl.focus();
    });
    qaListBodyEl.addEventListener('click', (e) => {
      const jumpBtn = e.target.closest('.qa-jump-btn');
      if (!jumpBtn) return;
      const targetDay = jumpBtn.dataset.day;
      const targetIdx = Number(jumpBtn.dataset.idx);
      if (!targetDay || Number.isNaN(targetIdx)) return;
      currentDayKey = targetDay;
      currentIndex = targetIdx;
      isEditMode = false;
      searchInputEl.value = '';
      searchClearEl.style.display = 'none';
      closeQaListModal();
      renderAll();
      scrollActiveDayTabIntoView();
      scrollActiveWordIntoView();
      mainContentEl.scrollTo({ top: 0, behavior: 'smooth' });
    });

    favListBtn.addEventListener('click', openFavListModal);
    favListCloseBtn.addEventListener('click', closeFavListModal);
    favListModalEl.addEventListener('click', (e) => {
      if (e.target === favListModalEl) closeFavListModal();
    });
    favSearchInputEl.addEventListener('input', () => {
      favSearchClearEl.style.display = favSearchInputEl.value ? 'block' : 'none';
      renderFavListModal();
    });
    favSearchClearEl.addEventListener('click', () => {
      favSearchInputEl.value = '';
      favSearchClearEl.style.display = 'none';
      renderFavListModal();
      favSearchInputEl.focus();
    });

    const navigateFromFavCard = (card) => {
      const targetDay = card.dataset.day;
      const targetIdx = Number(card.dataset.idx);
      if (!targetDay || Number.isNaN(targetIdx)) return;
      currentDayKey = targetDay;
      currentIndex = targetIdx;
      isEditMode = false;
      searchInputEl.value = '';
      searchClearEl.style.display = 'none';
      closeFavListModal();
      renderAll();
      scrollActiveDayTabIntoView();
      scrollActiveWordIntoView();
      mainContentEl.scrollTo({ top: 0, behavior: 'smooth' });
    };

    favListBodyEl.addEventListener('click', (e) => {
      const removeBtn = e.target.closest('.fav-remove-btn');
      if (removeBtn) {
        e.stopPropagation();
        const rDay = removeBtn.dataset.removeDay;
        const rIdx = Number(removeBtn.dataset.removeIdx);
        if (rDay && !Number.isNaN(rIdx)) {
          toggleWordFav(rDay, rIdx);
          renderFavListModal();
        }
        return;
      }
      const card = e.target.closest('.fav-item-card');
      if (card) navigateFromFavCard(card);
    });

    favListBodyEl.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      if (e.target.closest('.fav-remove-btn')) return;
      const card = e.target.closest('.fav-item-card');
      if (card) {
        e.preventDefault();
        navigateFromFavCard(card);
      }
    });

    bookPageEl.addEventListener('click', (e) => {
      if (e.target.closest('#titleFavBtn')) {
        toggleWordFav(currentDayKey, currentIndex);
      }
    });

    window.addEventListener('resize', () => {
      if (!isMobileViewport()) {
        sidebarEl.classList.remove('open');
        sidebarBackdropEl.classList.remove('open');
      }
      syncSidebarToggleButtonState();
      resizeAllAnswerTextareas();
    });

    function updateStickyTitleShadow() {
      const titleWrap = bookPageEl.querySelector('.book-title-wrap');
      if (!titleWrap) return;
      const toolbarEl = mainContentEl.querySelector('.page-toolbar');
      const threshold = toolbarEl ? toolbarEl.offsetHeight : 10;
      titleWrap.classList.toggle('is-stuck', mainContentEl.scrollTop > threshold);
    }

    mainContentEl.addEventListener('scroll', updateStickyTitleShadow, { passive: true });

    sidebarEl.addEventListener('transitionend', (e) => {
      if (e.propertyName === 'margin-left') {
        resizeAllAnswerTextareas();
        }
    });

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        resizeAllAnswerTextareas();
        });
    }

    if (typeof ResizeObserver !== 'undefined') {
      let lastBookPageWidth = 0;
      const pageResizeObserver = new ResizeObserver(() => {
        const w = Math.round(bookPageEl.getBoundingClientRect().width);
        if (w > 0 && w !== lastBookPageWidth) {
          lastBookPageWidth = w;
          resizeAllAnswerTextareas();
            }
      });
      pageResizeObserver.observe(bookPageEl);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeSettingsModal();
        closeQaListModal();
        closeFavListModal();
        if (isMobileViewport()) closeMobileSidebar();
      }
    });

    searchInputEl.addEventListener('input', () => {
      searchClearEl.style.display = searchInputEl.value ? 'block' : 'none';
      renderSidebar();
    });

    searchClearEl.addEventListener('click', () => {
      searchInputEl.value = '';
      searchClearEl.style.display = 'none';
      renderSidebar();
      searchInputEl.focus();
    });

    navOrderEl.addEventListener('click', () => {
      toggleWordRead(currentDayKey, currentIndex);
    });

    editToggleBtn.addEventListener('click', () => {
      isEditMode = !isEditMode;
      renderDetail();
    });

    prevWordBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        isEditMode = false;
        renderSidebar();
        renderDetail();
        scrollActiveWordIntoView();
        mainContentEl.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    todayWordBtn.addEventListener('click', () => {
      const todayDateStr = getLocalDateStr();
      const todayKey = getTodayDayKey();
      const todayMeta = getDayMeta(todayKey);
      const readTodayIdx = getReadIndexOnDate(todayKey, todayDateStr);
      const targetIdx = readTodayIdx !== -1 ? readTodayIdx : getNextWordIndexForDay(todayKey);
      const targetWord = VOCAB_LIST[todayKey][targetIdx][0];

      lastCheckedDateStr = todayDateStr;
      currentDayKey = todayKey;
      currentIndex = targetIdx;
      isEditMode = false;
      searchInputEl.value = '';
      searchClearEl.style.display = 'none';
      renderAll();
      scrollActiveDayTabIntoView();
      scrollActiveWordIntoView();
      mainContentEl.scrollTo({ top: 0, behavior: 'smooth' });
      if (readTodayIdx !== -1) {
        showToast(`오늘(${todayMeta.name} · ${todayDateStr}) 읽은 ${pad2(targetIdx + 1)}번 '${targetWord}' 어휘로 이동했습니다.`);
      } else {
        showToast(`오늘(${todayMeta.name}) · ${pad2(targetIdx + 1)}번 '${targetWord}' 어휘로 이동했습니다.`);
      }
    });

    nextWordBtn.addEventListener('click', () => {
      if (currentIndex < VOCAB_LIST[currentDayKey].length - 1) {
        currentIndex++;
        isEditMode = false;
        renderSidebar();
        renderDetail();
        scrollActiveWordIntoView();
        mainContentEl.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    // 저장하기: JSON 불러오기 (다중 파일 지원 -> localStorage 병합 저장)
    document.getElementById('importBtn').addEventListener('click', () => {
      jsonFileInput.value = '';
      jsonFileInput.click();
    });

    jsonFileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;

      let totalLoaded = 0;
      let totalAnswersLoaded = 0;
      let totalReadLoaded = 0;
      let totalFavLoaded = 0;
      let errorCount = 0;

      for (const file of files) {
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          const res = mergeJsonPayload(parsed);
          totalLoaded += res.added;
          totalAnswersLoaded += res.answersAdded;
          totalReadLoaded += res.readAdded;
          totalFavLoaded += res.favAdded;
        } catch (err) {
          console.error(file.name, err);
          errorCount++;
        }
      }

      saveToStorage();
      saveAnswersToStorage();
      saveReadToStorage();
      saveFavoritesToStorage();
      if (totalReadLoaded > 0) {
        currentIndex = getTargetWordIndexForDay(currentDayKey);
      }
      renderAll();
      scrollActiveWordIntoView();
      closeSettingsModal();

      const extraParts = [];
      if (totalReadLoaded > 0) extraParts.push(`읽음 ${totalReadLoaded}개`);
      if (totalFavLoaded > 0) extraParts.push(`즐겨찾기 ${totalFavLoaded}개`);
      if (totalAnswersLoaded > 0) extraParts.push(`답변 ${totalAnswersLoaded}개`);
      const extraMsg = extraParts.length ? `, ${extraParts.join(', ')}` : '';
      if (errorCount > 0) {
        showToast(`어휘 ${totalLoaded}개${extraMsg} 저장 (오류 ${errorCount}개)`);
      } else {
        showToast(`어휘 ${totalLoaded}개${extraMsg} 불러와 저장했습니다.`);
      }
    });

    // 백업: 통합 JSON 저장 (어휘 본문 + 읽음 기록 + 작성한 질문 답변 모두 포함)
    document.getElementById('exportBtn').addEventListener('click', () => {
      const ordered = {};
      DAYS_META.forEach(d => {
        VOCAB_LIST[d.key].forEach(([word, orig], idx) => {
          const key = getWordKey(d.key, idx);
          const item = getEntry(key);
          const answered = hasAnswer(key);
          const read = isWordRead(key);
          const fav = isWordFav(key);
          if (hasContent(item) || answered || read || fav) {
            const qCount = Array.isArray(item?.questions) ? item.questions.length : 1;
            ordered[key] = {
              word,
              orig,
              origin: item?.origin || '',
              quote: item?.quote || '',
              author: item?.author || '',
              essay: item?.essay || '',
              questions: Array.isArray(item?.questions) ? item.questions : [],
              ...(read ? {
                isRead: true,
                readAt: getWordReadAt(key),
                readDate: getWordReadDate(key)
              } : {}),
              ...(fav ? {
                isFavorite: true,
                favAt: getWordFavAt(key)
              } : {}),
              ...(answered ? {
                userAnswers: getAnswerItems(key, qCount),
                userAnswerUpdatedAt: getAnswerUpdatedAt(key)
              } : {})
            };
          }
        });
      });

      const count = Object.keys(ordered).length;
      if (count === 0) {
        showToast('저장된 데이터가 없어 빈 364개 틀을 생성합니다.');
        DAYS_META.forEach(d => {
          VOCAB_LIST[d.key].forEach(([word, orig], idx) => {
            ordered[getWordKey(d.key, idx)] = {
              word, orig, origin: '', quote: '', author: '', essay: '', questions: []
            };
          });
        });
      }

      const blob = new Blob([JSON.stringify(ordered, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = count === 364 ? 'mind-vocab-364.json' : `mind-vocab-backup-${count}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      closeSettingsModal();
      showToast('JSON 파일을 백업(저장)했습니다.');
    });

    // 웹 호스팅(GitHub Pages 등) 시 같은 폴더의 mind-vocab-364.json 자동 로드 시도
    async function tryAutoFetchJson() {
      if (countSavedTotal() > 0) return;
      if (!/^https?:/.test(location.protocol)) return;
      try {
        const res = await fetch('./mind-vocab-364.json');
        if (!res.ok) return;
        const parsed = await res.json();
        const result = mergeJsonPayload(parsed);
        if (result.added > 0 || result.answersAdded > 0 || result.readAdded > 0 || result.favAdded > 0) {
          saveToStorage();
          saveAnswersToStorage();
          saveReadToStorage();
          saveFavoritesToStorage();
          if (result.readAdded > 0) {
            currentIndex = getTargetWordIndexForDay(currentDayKey);
          }
          renderAll();
          scrollActiveWordIntoView();
          showToast(`기본 JSON에서 ${result.added}개 어휘를 자동 불러왔습니다.`);
        }
      } catch (_) {}
    }

    // 날짜/요일 변경 감지 (앱을 켜 둔 채 자정이 지나 다음 요일이 되면 자동으로 다음 어휘 표시)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') checkDayRollover();
    });
    window.addEventListener('focus', checkDayRollover);
    setInterval(checkDayRollover, 30000);

    // 초기화: ./data/*.js 자동 로드 + localStorage 복원 + 오늘 요일/다음 어휘 자동 선택
    loadDefaultDataFromScripts();
    loadFromStorage();
    syncToTodayAndNextWord(false);
    tryAutoFetchJson();
  </script>
</body>
</html>
